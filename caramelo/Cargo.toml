[package]
name = "caramelo"
version = "0.1.1-beta.2"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Idiomatic unit test framework for rust"
readme = "README.md"
license.workspace = true
keywords = ["testing", "assertions", "matchers"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["http", "json", "xml"]
http = ["dep:http", "dep:http-body", "dep:http-body-util"]
json = ["dep:sonic-rs", "dep:serde_json", "dep:jsonpath-rust"]
xml = ["dep:simdxml", "dep:serde", "dep:serde-xml-rs"]

[dependencies]
http = { version = "1.4.2", optional = true }
http-body = { version = "1.0.1", optional = true }
http-body-util = { version = "0.1.3", optional = true }
jsonpath-rust = { version = "1.0.4", optional = true }
regex = "1.12.4"
serde = { version = "1.0.219", optional = true }
serde_json = { version = "1.0.150", optional = true }
serde-xml-rs = { version = "0.8.2", optional = true }
simdxml = { version = "0.2.1", optional = true }
sonic-rs = { version = "0.5.8", optional = true }
