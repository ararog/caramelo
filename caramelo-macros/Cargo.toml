[package]
name = "caramelo-macros"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Caramelo macros"
readme = "README.md"
license.workspace = true
keywords = ["testing", "assertions", "matchers"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }
caramelo = { workspace = true }

[dev-dependencies]
trybuild = "1.0.111"
